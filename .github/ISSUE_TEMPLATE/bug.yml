name: Bug report
description: Report incorrect workflow behaviour or a broken source integration
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not paste rider profiles, raw session logs, exact accommodation details, API keys, shop/seller messages, or rental bookings.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the command and result without personal data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AI tool and version
      placeholder: "Tool name and version"
  - type: textarea
    id: context
    attributes:
      label: Non-private context
      description: Region pack, date, and source URLs if relevant.
