name: Spot or calibration proposal
description: Propose a sourced public spot fact or anonymized calibration lesson
title: "[Spot]: "
labels:
  - spot-data
body:
  - type: markdown
    attributes:
      value: |
        Only established public spots. Never include raw sessions, private breaks, exact accommodation, names, or contact details.
        For an observed model/spot pattern, follow method/calibration-promotion.md and submit only the approved anonymized summary.
  - type: input
    id: region
    attributes:
      label: Country and region
    validations:
      required: true
  - type: input
    id: spot
    attributes:
      label: Public spot name
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed fact or generalized rule
    validations:
      required: true
  - type: textarea
    id: condition
    attributes:
      label: Condition bucket
      description: For calibration, give only the generalized swell direction/period, wind regime, tide stage, and time-of-day bucket. Leave blank for a simple sourced fact.
  - type: input
    id: observation_count
    attributes:
      label: Observation count
      description: For community calibration only. Give the aggregate count, not dates or raw rows.
      placeholder: "Example: 5"
  - type: input
    id: contributor_count
    attributes:
      label: Independent contributor count
      description: Repeated sessions from one surfer still count as one contributor.
      placeholder: "Example: 1"
  - type: textarea
    id: counterexamples
    attributes:
      label: Counterexamples and uncertainty
      description: State what did not match and where the rule may fail.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Direct public URLs or anonymized observation and independent-contributor counts.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed names, raw rows, exact session times, rider/board details, accommodation, bookings, seller messages, and private-break information.
          required: true
  - type: dropdown
    id: sensitivity
    attributes:
      label: Is this already a well-published break?
      options:
        - "Yes — documented by multiple established public sources"
        - "Uncertain — maintainer should review sensitivity"
        - "No — do not publish coordinates"
    validations:
      required: true
